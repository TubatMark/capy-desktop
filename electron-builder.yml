appId: com.m4rk.capy
productName: capy
copyright: Copyright © 2026 m4rk
directories:
  output: dist
  buildResources: build
# Only the bundled main process ships inside the asar; node_modules are not needed there.
files:
  - dist-electron/**
  - package.json
  - "!node_modules/**"
asar: true
# The standalone server ships as Resources/server. electron-builder always drops the *root* node_modules of an
# extraResources source (builder-util filter.js), so node_modules goes in as its own entry; its copier recreates the
# pnpm symlinks. Dot-directories need naming explicitly.
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - ".next/**"
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter:
      - "**/*"
      - ".pnpm/**"
      - ".pnpm/**/.*"
      - ".pnpm/**/.*/**"
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  category: public.app-category.video
  icon: build/icon.png
  darkModeSupport: true
dmg:
  sign: false
